<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حللن</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="page">

  <header class="masthead">
    <div class="masthead__mark">◎</div>
    <div class="masthead__text">
      <h1>حللن</h1>
      <p>يقرالك بيانات الصور, واذا هي محذوفه يتوقع وش صار للصورة</p>
    </div>
  </header>

  <section class="intake" id="intake">
    <div class="intake__dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" hidden />
      <div class="intake__icon">＋</div>
      <p class="intake__label">اختر الصورة</p>
      <p class="intake__hint" dir="ltr">JPEG · PNG · HEIC · TIFF · WEBP — حتى 20MB</p>
    </div>
    <div class="intake__preview" id="preview" hidden>
      <img id="previewImg" alt="معاينة الصورة" />
      <div class="intake__preview-info">
        <span id="previewName" dir="ltr"></span>
        <button id="analyzeBtn" class="btn">حللن</button>
        <button id="resetBtn" class="btn btn--ghost">اختر صورة ثانية</button>
      </div>
    </div>
  </section>

  <section class="status" id="status" hidden>
    <div class="status__scan"></div>
    <p>اصبر شويات</p>
  </section>

  <section class="error" id="error" hidden></section>

  <section class="report" id="report" hidden>

    <div class="report__head">
      <div class="report__field">
        <span class="report__field-label">رقم العيّنة</span>
        <span class="report__field-value" id="exhibitId" dir="ltr">—</span>
      </div>
      <div class="report__field">
        <span class="report__field-label">تاريخ التحليل</span>
        <span class="report__field-value" id="analyzedAt" dir="ltr">—</span>
      </div>
      <div class="report__field">
        <span class="report__field-label">اسم الملف</span>
        <span class="report__field-value" id="reportFileName" dir="ltr">—</span>
      </div>
    </div>

    <div class="report__section">
      <h2>اهم المعلومات</h2>
      <div class="highlights" id="highlightsBox"></div>
    </div>

    <div class="report__section">
      <h2>التحقق من الصورة</h2>
      <table class="kv-table" id="hashTable" dir="ltr"></table>
    </div>

    <div class="report__section">
      <h2>تحليل المصدر</h2>
      <div id="fingerprintBox"></div>
    </div>

    <div class="report__section">
      <h2>البيانات <span class="report__count" id="fieldCount"></span></h2>
      <p class="report__note" id="metadataNote"></p>
      <div id="metadataGroups"></div>
    </div>

  </section>

</div>

<script src="/script.js"></script>
</body>
</html>
